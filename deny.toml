# cargo-deny policy (run by scripts/check.sh and CI): every dependency must have a license that is
# compatible with AGPL-3.0-only, come from crates.io, and have no known vulnerability.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate warnings are enforced for our direct dependencies. Transitive ones currently
# come only from Tauri's Linux GTK/D-Bus stack (see docs/technical/12-testing.md) and are reported
# by `cargo audit` without failing the build. Vulnerabilities always fail.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-only",          # this project
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",                # file-level copyleft, GPL-compatible
    "LGPL-2.1-or-later",      # r-efi (UEFI only; also offered as MIT / Apache-2.0)
]

[bans]
multiple-versions = "allow"   # Tauri pulls several versions of some crates; not a security issue
wildcards = "deny"
allow-wildcard-paths = true   # our own path dependencies (all crates are publish = false)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
