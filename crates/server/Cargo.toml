[package]
name = "ctrlaltnotes-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Web version: a hardened localhost-only HTTP host for the CtrlAltNotes backend (std only, no async runtime)"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ctrlaltnotes_server"
path = "src/lib.rs"

[[bin]]
name = "ctrlaltnotes-web"
path = "src/main.rs"

[dependencies]
ctrlaltnotes-core = { path = "../core" }
ctrlaltnotes-service = { path = "../service" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
