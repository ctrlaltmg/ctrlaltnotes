[package]
name = "ctrlaltnotes-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "CtrlAltNotes native app for macOS, Windows and Linux (Tauri 2 shell around the shared Rust backend)"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ctrlaltnotes-service = { path = "../crates/service" }
serde_json = "1"
