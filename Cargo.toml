[workspace]
resolver = "2"
members = ["crates/core", "crates/service", "crates/server", "app"]
# Plain `cargo test` / `cargo build` skip the desktop shell; build it with `cargo tauri build`.
default-members = ["crates/core", "crates/service", "crates/server"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
# keep integer-overflow panics in release builds (wrap-around bugs become crashes, not silent errors)
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
